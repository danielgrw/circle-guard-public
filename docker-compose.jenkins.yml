# CI/CD infrastructure for the Circle Guard project.
# Run AFTER docker-compose.dev.yml (which handles Postgres, Neo4j, Kafka, Redis, OpenLDAP).
#
# Usage:
#   docker compose -f docker-compose.jenkins.yml up -d
#
# Jenkins UI: http://localhost:8080
# Configuration: copy .env.jenkins.example → .env.jenkins and set CIRCLEGUARD_GIT_URL (see docs/bootstrap/README.md).
# Admin user: admin / password from JENKINS_ADMIN_PASSWORD in .env.jenkins (wizard disabled; CasC applies config).

services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/docker/Dockerfile
    image: circleguard/jenkins:local
    container_name: jenkins
    restart: unless-stopped
    user: root                     # Required to access the Docker socket
    ports:
      - "8080:8080"                # Jenkins web UI
      - "50000:50000"              # Jenkins inbound agent port (JNLP)
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Docker socket mount for DooD
    env_file:
      - .env.jenkins
    networks:
      - ci-net

  # Optional local Docker registry — avoids Docker Hub rate limits.
  # Push / image refs (DooD: host daemon → use host-reachable host:port, default localhost:5000)
  # Shared library: CI_REGISTRY_HOST (CasC default localhost:5000). kind dev charts use the same.
  registry:
    image: registry:2
    container_name: docker-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - ci-net

volumes:
  jenkins_home:
    name: circleguard_jenkins_home
  registry_data:
    name: circleguard_registry_data

networks:
  ci-net:
    name: circleguard-ci
    driver: bridge
