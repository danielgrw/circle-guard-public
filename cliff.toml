# git-cliff configuration — CircleGuard release notes (AR-8 / AR-16)
# Run from repository root: git-cliff --tag $(git describe --tags --abbrev=0) -o RELEASE_NOTES.md
# Jenkins: set GIT_CLIFF_BIN if the binary is not on PATH.

[changelog]
header = "# Release Notes\n\n"
body = """
{% if version %}
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | trim }}
{% endfor %}

{% endfor %}
"""
footer = """
---
_Generated by git-cliff from Conventional Commits (`feat`, `fix`, `test`, `ci`, `chore`)._
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
topo_order_commits = true
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^feat(\\([^)]*\\))?!?:", group = "Features" },
  { message = "^fix(\\([^)]*\\))?!?:", group = "Fixes" },
  { message = "^test(\\([^)]*\\))?!?:", group = "Tests" },
  { message = "^ci(\\([^)]*\\))?!?:", group = "CI" },
  { message = "^chore(\\([^)]*\\))?!?:", group = "Chores" },
]
