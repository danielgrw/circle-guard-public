spring:
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password
  # No kafka stanza here — unit tests mock KafkaTemplate with plain Mockito.
  # Real Kafka wiring happens only in src/integrationTest via Testcontainers.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
