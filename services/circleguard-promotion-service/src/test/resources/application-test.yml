spring:
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      auto-offset-reset: earliest
