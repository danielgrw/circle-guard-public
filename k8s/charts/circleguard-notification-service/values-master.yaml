# Port matches services/circleguard-notification-service/src/main/resources/application.yml (server.port: 8082).
# Master: mirror Stage registry/repo pattern — pipeline passes `--set image.tag=<7-char-sha>` via deployToNamespace.
image:
  repository: docker-registry:5000/circleguard-notification-service
  tag: "master"
  pullPolicy: Always

service:
  port: 8082

env: master
replicaCount: 2
resources: {}
